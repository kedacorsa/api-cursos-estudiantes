# ===== H2 en archivo: los datos se guardan en la carpeta ./data del proyecto =====
spring.datasource.url=jdbc:h2:file:./data/cursosdb;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Consola web para ver las tablas: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:file:./data/cursosdb   Usuario: sa   Clave: (vacia)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
